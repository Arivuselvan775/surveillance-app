<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordings Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --btn-red: #ef4444;
            --btn-red-hover: #dc2626;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
        }

        audio {
            width: 100%;
            outline: none;
        }

        .btn-delete {
            background-color: var(--btn-red);
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto;
        }

        .btn-delete:hover {
            background-color: var(--btn-red-hover);
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 3rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Recordings Dashboard</h1>
        <div class="grid" id="recordingsGrid">
            <!-- Cards will be inserted here -->
        </div>
    </div>

    <script>
        async function fetchRecordings() {
            try {
                const response = await fetch('/api/recordings');
                const files = await response.json();
                renderRecordings(files);
            } catch (err) {
                console.error('Error fetching recordings:', err);
                document.getElementById('recordingsGrid').innerHTML = '<div class="empty-state">Failed to load recordings.</div>';
            }
        }

        function renderRecordings(files) {
            const grid = document.getElementById('recordingsGrid');
            grid.innerHTML = ''; // Clear current

            if (files.length === 0) {
                grid.innerHTML = '<div class="empty-state">No recordings found.</div>';
                return;
            }

            files.forEach(filename => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${filename}`;

                const header = document.createElement('div');
                header.className = 'card-header';
                // Simple formatting of the timestamp part of the filename
                const displayTitle = filename.replace('recording-', '').replace('.webm', '').replace(/-/g, ':').replace('T', ' ').substring(0, 19) || filename;
                header.innerText = displayTitle;

                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = `/uploads/${filename}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerText = 'Delete';
                deleteBtn.onclick = () => deleteRecording(filename);

                card.appendChild(header);
                card.appendChild(audio);
                card.appendChild(deleteBtn);
                
                grid.appendChild(card);
            });
        }

        async function deleteRecording(filename) {
            if (confirm(`Are you sure you want to delete ${filename}?`)) {
                try {
                    const response = await fetch(`/api/recordings/${filename}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        const card = document.getElementById(`card-${filename}`);
                        if (card) {
                            card.remove();
                        }
                        
                        // Check if empty
                        const grid = document.getElementById('recordingsGrid');
                        if (grid.children.length === 0) {
                            grid.innerHTML = '<div class="empty-state">No recordings found.</div>';
                        }
                    } else {
                        alert('Failed to delete the file.');
                    }
                } catch (err) {
                    console.error('Error deleting recording:', err);
                    alert('An error occurred while deleting.');
                }
            }
        }

        // Initial fetch
        fetchRecordings();
    </script>
</body>
</html>
