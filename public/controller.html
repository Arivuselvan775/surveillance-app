<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Controller</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --btn-red: #ef4444;
            --btn-red-hover: #dc2626;
            --input-bg: #334155;
            --radius: 16px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
            border-radius: 8px;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: var(--btn-green);
        }

        button {
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 1rem;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-start {
            background-color: var(--btn-green);
        }

        .btn-start:hover {
            background-color: var(--btn-green-hover);
        }

        .btn-stop {
            background-color: var(--btn-red);
            margin-bottom: 0;
        }

        .btn-stop:hover {
            background-color: var(--btn-red-hover);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Controller</h2>
        <p>Remote trigger for audio recording</p>

        <input type="password" id="password" placeholder="Enter Password" />
        
        <button class="btn-start" id="startBtn">Start Recording</button>
        <button class="btn-stop" id="stopBtn">Stop & Upload</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const pwdInput = document.getElementById('password');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.addEventListener('click', () => {
            const password = pwdInput.value;
            socket.emit('trigger-start', { password });
            console.log('Sent trigger-start');
        });

        stopBtn.addEventListener('click', () => {
            const password = pwdInput.value;
            socket.emit('trigger-stop', { password });
            console.log('Sent trigger-stop');
        });
    </script>
</body>
</html>
