<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Extension Options</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 400px; margin: 0 auto; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #2563eb; }
        .success { color: green; display: none; margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Microphone Access Required</h2>
    <p>This extension needs microphone permission to record audio in the background. Please click the button below and click "Allow" on the browser prompt.</p>
    <button id="grantBtn">Grant Microphone Access</button>
    <p class="success" id="successMsg">Microphone access granted! You can now close this tab.</p>

    <script src="options.js"></script>
</body>
</html>
